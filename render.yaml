        value: 8845793711
      - key: MARKET_DATA_API_KEY
        value: 1205b6ecb0354aeaab07424aad620208
      - key: TWELVE_DATA_API_KEY
        value: 1205b6ecb0354aeaab07424aad620208
      - key: CRYPTOMUS_MERCHANT_ID
