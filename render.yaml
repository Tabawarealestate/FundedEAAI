services:
  - type: web
    name: hikima-x10-ai
    env: node
    buildCommand: npm install && npx prisma db push && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: CRYPTOMUS_MERCHANT_ID
        sync: false
      - key: CRYPTOMUS_API_KEY
        sync: false
      - key: DEFAULT_FREE_ACCESS_CODE
        value: X10H
      - key: DATABASE_URL
        fromDatabase:
          name: hikima-db
          property: connectionString

databases:
  - name: hikima-db
    databaseName: hikimax10
    user: hikima
